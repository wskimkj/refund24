<script>
  function addRow() {
    const table = document.getElementById("productTable").getElementsByTagName("tbody")[0];
    const row = table.insertRow();
    row.innerHTML = `
      <td><input type="text" value="" placeholder="상품명"></td>
      <td><input type="number" value="" min="0" placeholder="0"></td>
      <td><input type="number" value="" min="0" placeholder="0"></td>
      <td><input type="checkbox"></td>
    `;
  }

  function calculateRefund() {
    const pointsUsed = parseInt(document.getElementById('points').value) || 0;

    // 장바구니 일반쿠폰: 금액/퍼센트 처리
    const extraCouponRaw = parseInt(document.getElementById('extraCoupon').value) || 0;
    const extraCouponType = document.getElementById('extraCouponType').value;

    const reason = document.getElementById('reason').value;
    const returnShippingPayment = document.getElementById('returnShippingPayment').value;

    const rows = document.getElementById("productTable").getElementsByTagName("tbody")[0].rows;

    // 1) 상품 전체 합계 (개별할인 반영 후)
    let totalBeforeCoupon = 0;
    const items = []; // 계산 편의상 아이템 배열로
    for (let row of rows) {
      const name = row.cells[0].querySelector("input").value || "상품";
      const price = parseInt(row.cells[1].querySelector("input").value) || 0;
      const discount = parseInt(row.cells[2].querySelector("input").value) || 0;
      const realPrice = Math.max(price - discount, 0);
      const checked = row.cells[3].querySelector("input").checked;

      totalBeforeCoupon += realPrice;
      items.push({ name, realPrice, checked });
    }

    const resultContainer = document.getElementById('resultContainer');
    const hiddenResultDiv = document.getElementById('result');

    // 환불 체크 최소 1개
    const hasRefund = items.some(it => it.checked);
    if (!hasRefund) {
      resultContainer.classList.add('empty');
      resultContainer.innerHTML = `
        <div class="result-top">
          <span class="result-label">Refund Breakdown</span>
        </div>
        <div class="result-text">
          <p class="result-empty">환불 상품이 선택되지 않았습니다. 최소 1개 이상 체크해 주세요.</p>
        </div>
      `;
      return;
    }

    // 2) 장바구니 일반쿠폰 계산 (원 / %)
    let extraCoupon = 0;
    if (extraCouponType === 'amount') {
      extraCoupon = extraCouponRaw;
    } else {
      const percent = Math.max(0, Math.min(extraCouponRaw, 100));
      extraCoupon = Math.floor(totalBeforeCoupon * (percent / 100));
    }
    extraCoupon = Math.min(extraCoupon, totalBeforeCoupon);

    // 3) 조건부 쿠폰(기존+사용자입력) 수집
    let selectedCoupons = [];

    // (1) 기존 쿠폰
    selectedCoupons.push(
      ...Array.from(document.querySelectorAll('input[name="coupon"]:checked'))
        .map(c => c.value.split("-").map(Number)) // [discount, condition]
    );

    // (2) 사용자 입력 쿠폰
    Array.from(document.querySelectorAll('input[name="couponCustom"]')).forEach(chk => {
      if (!chk.checked) return;
      const row = chk.closest('label');
      const condition = parseInt(row.querySelector('.customCondition')?.value) || 0;
      const discount  = parseInt(row.querySelector('.customDiscount')?.value) || 0;
      if (condition > 0 && discount > 0) {
        selectedCoupons.push([discount, condition]);
      }
    });

    // 결제 당시(전체 기준) 조건부 쿠폰 총액
    let totalConditionalCoupon = 0;
    selectedCoupons.forEach(([discount, condition]) => {
      if (totalBeforeCoupon >= condition) totalConditionalCoupon += discount;
    });

    // 4) extraCoupon(일반쿠폰) 비율 배분 + 환불/미환불 금액 산출
    //    (적립금은 여기서 비율 배분하지 않음)
    let refundNetAfterExtra = 0; // 환불상품: (실결제금액 - 일반쿠폰배분)
    let keptNetAfterExtra = 0;  // 미환불상품: (실결제금액 - 일반쿠폰배분)

    let refundDetails = "<strong>상품별 환불 내역:</strong><br>";
    let keptDetails = "<br><strong>미환불(구매확정) 내역:</strong><br>";

    // 모두 환불 여부
    const allRefunded = items.every(it => it.checked);

    for (let it of items) {
      const ratio = totalBeforeCoupon > 0 ? it.realPrice / totalBeforeCoupon : 0;
      const extraAllocated = Math.floor(extraCoupon * ratio);
      const netAfterExtra = Math.max(it.realPrice - extraAllocated, 0);

      if (it.checked) {
        refundNetAfterExtra += netAfterExtra;
        refundDetails += `${it.name} (상품가 ${it.realPrice.toLocaleString()} - 일반쿠폰 ${extraAllocated.toLocaleString()}) → 환불기준 ${netAfterExtra.toLocaleString()}원<br>`;
      } else {
        keptNetAfterExtra += netAfterExtra;
        keptDetails += `${it.name} (상품가 ${it.realPrice.toLocaleString()} - 일반쿠폰 ${extraAllocated.toLocaleString()}) → 구매확정기준 ${netAfterExtra.toLocaleString()}원<br>`;
      }
    }

    refundDetails += `<br>환불 기준 합계(일반쿠폰 반영): ${refundNetAfterExtra.toLocaleString()}원<br>`;
    keptDetails += `<br>미환불 기준 합계(일반쿠폰 반영): ${keptNetAfterExtra.toLocaleString()}원<br>`;

    // 5) ✅ 적립금 로직 변경: 미환불 금액에서만 50%까지 사용 가능
    const maxPointsUsableOnKept = Math.floor(keptNetAfterExtra * 0.5);
    const pointsAppliedToKept = Math.min(pointsUsed, maxPointsUsableOnKept);
    const pointsReturned = Math.max(pointsUsed - pointsAppliedToKept, 0);

    let pointsMsg = `<br><strong>적립금 처리(신규 로직):</strong><br>`;
    pointsMsg += `사용 적립금: ${pointsUsed.toLocaleString()}원<br>`;
    pointsMsg += `미환불 금액의 50% 한도: ${maxPointsUsableOnKept.toLocaleString()}원<br>`;
    pointsMsg += `미환불에 적용 처리: -${pointsAppliedToKept.toLocaleString()}원<br>`;
    pointsMsg += `<strong>반환 적립금: ${pointsReturned.toLocaleString()}원</strong><br>`;

    // 6) 조건부 쿠폰 유지/무효 판정: "남은 금액" 기준은 미환불(keep) 합계로 판단
    //    (기존에는 keptTotal(개별할인 후)로 했는데, 쿠폰 판단도 실질 결제기준이 낫다면 keptNetAfterExtra로 보는게 더 일관됨)
    let validConditionalCoupon = 0;
    let couponMessages = "<br><strong>조건부 쿠폰 내역:</strong><br>";

    selectedCoupons.forEach(([discount, condition]) => {
      if (keptNetAfterExtra >= condition) {
        validConditionalCoupon += discount;
        couponMessages += `쿠폰 ${discount.toLocaleString()}원 유지<br>`;
      } else {
        couponMessages += `<span style="color:#b91c1c">쿠폰 ${discount.toLocaleString()}원 무효화</span><br>`;
      }
    });

    const lostConditionalCoupon = totalConditionalCoupon - validConditionalCoupon;

    // 7) ✅ 현금(카드) 환불액 시작값: 환불 기준 합계(일반쿠폰 반영)
    //    적립금은 "반환"으로 별도 표시하므로 여기서 빼지 않음.
    let finalCashRefund = refundNetAfterExtra;

    if (lostConditionalCoupon > 0) {
      couponMessages += `<span style="color:#b91c1c">총 ${lostConditionalCoupon.toLocaleString()}원 쿠폰 회수로 현금환불액에서 차감</span><br>`;
      finalCashRefund -= lostConditionalCoupon;
    }

    // 8) 배송비 로직
    const FREE_LIMIT = 30000;
    const SHIPPING = 3000;
    let shippingDeduction = 0;
    let shippingDetails = "<br><strong>배송비 내역:</strong><br>";

    if (reason === "buyer" && hasRefund) {
      // 반품배송비
      if (returnShippingPayment === "deduct") {
        shippingDeduction += SHIPPING;
        shippingDetails += `반품배송비 차감: -${SHIPPING.toLocaleString()}원<br>`;
      } else {
        shippingDetails += `반품배송비 선결제(직접 부담): 현금환불액에서 추가 차감 없음<br>`;
      }

      // 초도배송비 차감 조건 판단:
      // - 전체환불이면 (초도배송비 무료조건 이상 주문이었다면) 차감
      // - 부분환불이면 남은 금액이 무료배송 기준 미만이면 차감
      // 기준 금액은 "미환불 기준 합계(일반쿠폰 반영)"을 사용
      if (allRefunded && totalBeforeCoupon >= FREE_LIMIT) {
        shippingDeduction += SHIPPING;
        shippingDetails += `전체 환불 + (원주문 ${totalBeforeCoupon.toLocaleString()}원 ≥ ${FREE_LIMIT.toLocaleString()}원) → 초도배송비 차감: -${SHIPPING.toLocaleString()}원<br>`;
      } else if (!allRefunded && keptNetAfterExtra < FREE_LIMIT) {
        shippingDeduction += SHIPPING;
        shippingDetails += `부분 환불 + 남은 금액 ${keptNetAfterExtra.toLocaleString()}원 < ${FREE_LIMIT.toLocaleString()}원 → 초도배송비 차감: -${SHIPPING.toLocaleString()}원<br>`;
      }
    } else {
      shippingDetails += "판매자 사유: 배송비 차감 없음<br>";
    }

    finalCashRefund -= shippingDeduction;
    const safeCashRefund = Math.max(finalCashRefund, 0);

    // 9) 결과 출력 (현금 환불 + 적립금 반환 분리 표기)
    const combinedHtml =
      refundDetails +
      keptDetails +
      pointsMsg +
      couponMessages +
      shippingDetails +
      `<br><strong>현금(카드) 환불액: <span style="color:#166534">${safeCashRefund.toLocaleString()}원</span></strong><br>` +
      `<strong>적립금 반환: <span style="color:#7f1d3a">${pointsReturned.toLocaleString()}원</span></strong>`;

    hiddenResultDiv.innerHTML = combinedHtml;

    resultContainer.classList.remove('empty');
    resultContainer.innerHTML = `
      <div class="result-top">
        <span class="result-label">Refund Breakdown</span>
        <span class="badge-reason">${reason === "buyer" ? "구매자 사유" : "판매자 사유"}</span>
      </div>
      <div class="result-amount">
        ${safeCashRefund.toLocaleString()}<span class="currency">원 현금 환불</span>
      </div>
      <div class="result-text">
        ${combinedHtml}
      </div>
    `;
  }

  function resetForm() {
    // 기존 resetForm이 너 코드에 없어서, 혹시 필요하면 간단 버전:
    document.getElementById('points').value = 0;
    document.getElementById('extraCoupon').value = 0;
    document.getElementById('extraCouponType').value = 'amount';
    document.getElementById('reason').value = 'buyer';
    document.getElementById('returnShippingPayment').value = 'deduct';

    document.querySelectorAll('input[name="coupon"]').forEach(el => el.checked = false);
    document.querySelectorAll('input[name="couponCustom"]').forEach(el => {
      el.checked = false;
      const row = el.closest('label');
      if (row) {
        const c = row.querySelector('.customCondition');
        const d = row.querySelector('.customDiscount');
        if (c) c.value = "";
        if (d) d.value = "";
      }
    });

    const tbody = document.getElementById("productTable").getElementsByTagName("tbody")[0];
    while (tbody.rows.length > 2) tbody.deleteRow(-1);
    for (let i = 0; i < Math.min(2, tbody.rows.length); i++) {
      tbody.rows[i].cells[0].querySelector("input").value = "";
      tbody.rows[i].cells[1].querySelector("input").value = "";
      tbody.rows[i].cells[2].querySelector("input").value = "";
      tbody.rows[i].cells[3].querySelector("input").checked = false;
    }

    const resultContainer = document.getElementById('resultContainer');
    resultContainer.classList.add('empty');
    resultContainer.innerHTML = `
      <div class="result-top">
        <span class="result-label">Refund Breakdown</span>
      </div>
      <div class="result-text">
        <p class="result-empty">
          환불할 상품을 체크하고 금액을 입력한 뒤 <strong>“환불액 계산”</strong> 버튼을 눌러주세요.
        </p>
      </div>
    `;
  }
</script>
